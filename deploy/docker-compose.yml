name: acbi
services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 6
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_DB_HOST: acbi-app-db
      APP_DB_USER: ${APP_DB_USER:-acbi_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/prepare_warehouse.py first}
      APP_DB_NAME: ${APP_DB_NAME:-acbi}
      WAREHOUSE_HOST: ${WAREHOUSE_HOST:-host.docker.internal}
      WAREHOUSE_PORT: ${WAREHOUSE_PORT:-5432}
      WAREHOUSE_DATABASE: ${WAREHOUSE_DATABASE:-Adventureworks}
      WAREHOUSE_USER: acbi_ro
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?Run scripts/prepare_warehouse.py first}
      WAREHOUSE_SSLMODE: ${WAREHOUSE_SSLMODE:-verify-full}
      DATA_AS_OF: ${DATA_AS_OF:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-15}
      LLM_TOKENS_PER_MINUTE: ${LLM_TOKENS_PER_MINUTE:-8000}
      LLM_MAX_CALLS_PER_REQUEST: ${LLM_MAX_CALLS_PER_REQUEST:-3}
      LOCAL_INTENT_ENABLED: ${LOCAL_INTENT_ENABLED:-true}
      SEND_RESULTS_TO_LLM: ${SEND_RESULTS_TO_LLM:-false}
      EXTERNAL_RESULTS_ENABLED: ${EXTERNAL_RESULTS_ENABLED:-false}
      EXTERNAL_METADATA_ENABLED: ${EXTERNAL_METADATA_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, storage]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-acbi_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/prepare_warehouse.py first}
      POSTGRES_DB: ${APP_DB_NAME:-acbi}
    volumes:
      - app_data:/var/lib/postgresql/data
    networks:
      storage:
        aliases: [acbi-app-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  edge: {}
  storage:
    internal: true
volumes:
  app_data: {}
