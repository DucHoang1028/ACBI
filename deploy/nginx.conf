server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }
    location / { try_files $uri $uri/ /index.html; }
}
