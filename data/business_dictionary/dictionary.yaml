schemaVersion: 1
status: approved
dataSources:
- sourceId: adventureworks
  name: AdventureWorks 2014 OLTP PostgreSQL port
  database: Adventureworks
  schemas:
  - humanresources
  - person
  - production
  - purchasing
  - sales
  - acbi_demo
  connectionRole: acbi_ro
  credentials: environment only
businessMetrics:
- metricId: production_output
  name: Production output
  displayName: {vi: Sản lượng, en: Production output}
  synonyms:
    vi: [sản lượng, số lượng sản xuất]
    en: [production output, output, produced units]
  domain: production
  description: "Good units produced by work orders (ordered minus scrapped), dated by completion. Use for output or produced quantity (sản lượng)."
  supportedDimensions:
  - date
  - product
  - product_category
  - production_line
  - factory
  definitions:
  - version: 1
    formula: SUM(orderqty - scrappedqty)
    unit: units
    approvalStatus: approved
    effectiveFrom: '2026-09-19'
    dateColumn: production.workorder.enddate
    dataMappingIds:
    - production_fact
    emptySetPolicy: no_data; do not coalesce absence to zero
- metricId: defect_rate
  name: Defect rate
  displayName: {vi: Tỷ lệ phế phẩm, en: Defect rate}
  synonyms:
    vi: [tỷ lệ phế phẩm, tỷ lệ lỗi, phế phẩm, phế liệu, hàng lỗi]
    en: [defect rate, scrap rate, scrap, defects]
  domain: quality
  description: "Share of ordered units that were scrapped. Use for defect, scrap or error rate (tỷ lệ lỗi, phế phẩm)."
  supportedDimensions:
  - date
  - product
  - product_category
  - production_line
  - factory
  - scrap_reason
  definitions:
  - version: 1
    formula: SUM(scrappedqty)::numeric / NULLIF(SUM(orderqty),0)
    unit: ratio
    approvalStatus: approved
    effectiveFrom: '2026-09-19'
    dateColumn: production.workorder.enddate
    dataMappingIds:
    - production_fact
    emptySetPolicy: no_data; do not coalesce absence to zero
- metricId: on_time_rate
  name: On-time completion rate
  displayName: {vi: Tỷ lệ hoàn thành đúng hạn, en: On-time completion rate}
  synonyms:
    vi: [đúng hạn, hoàn thành đúng hạn, trễ hạn, đúng tiến độ]
    en: [on-time, on time, late work orders]
  domain: production
  description: "Share of work orders finished on or before their due date. Use for on-time or late completion (đúng hạn, trễ hạn)."
  reviewNote: Added 2026-09-21 at the owner's request to cover the proposal's line-performance example; the formula was proposed by the assistant and approved by the owner's delegation, so review it.
  supportedDimensions:
  - date
  - product
  - product_category
  - production_line
  - factory
  definitions:
  - version: 1
    formula: COUNT(*) FILTER (WHERE enddate <= duedate)::numeric / NULLIF(COUNT(*),0)
    unit: ratio
    approvalStatus: approved
    effectiveFrom: '2026-09-21'
    dateColumn: production.workorder.enddate
    dataMappingIds:
    - production_fact
    emptySetPolicy: no_data; do not coalesce absence to zero
- metricId: revenue
  name: Revenue
  displayName: {vi: Doanh thu, en: Revenue}
  synonyms:
    vi: [doanh thu, doanh số]
    en: [revenue, sales]
  domain: sales
  description: "Sum of order subtotals (tax and freight excluded), dated by order date. Use for revenue or sales amounts (doanh thu, doanh số)."
  supportedDimensions:
  - date
  - sales_territory
  - product
  - product_category
  definitions:
  - version: 1
    formula: SUM(sales.salesorderheader.subtotal)
    unit: source_currency
    approvalStatus: approved
    effectiveFrom: '2026-09-19'
    dateColumn: sales.salesorderheader.orderdate
    dataMappingIds:
    - sales_fact
    emptySetPolicy: no_data; do not coalesce absence to zero
- metricId: sales_growth
  name: Sales growth
  displayName: {vi: Tăng trưởng doanh thu, en: Revenue growth}
  synonyms:
    vi: [tăng trưởng doanh thu, tăng trưởng]
    en: [revenue growth, sales growth, growth]
  domain: sales
  description: "Percentage change of revenue against the immediately preceding period of equal length: last month against the month before, last quarter against the quarter before. Use when the user compares with the previous period or asks how much revenue grew or fell (so với tháng trước, tăng hoặc giảm bao nhiêu)."
  supportedDimensions:
  - date
  - sales_territory
  definitions:
  - version: 1
    formula: (current_revenue-previous_revenue)/NULLIF(previous_revenue,0)
    unit: ratio
    approvalStatus: approved
    effectiveFrom: '2026-09-19'
    dateColumn: sales.salesorderheader.orderdate
    dataMappingIds:
    - sales_fact
    emptySetPolicy: no_data; do not coalesce absence to zero
