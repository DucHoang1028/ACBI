  reference_sql: |-
    WITH lines AS (
     SELECT h.salesorderid,h.orderdate,h.subtotal,d.productid,
     d.orderqty*d.unitprice*(1-d.unitpricediscount) AS net,
     SUM(d.orderqty*d.unitprice*(1-d.unitpricediscount)) OVER (PARTITION BY h.salesorderid) AS order_net
     FROM sales.salesorderheader h JOIN sales.salesorderdetail d ON d.salesorderid=h.salesorderid
     WHERE h.orderdate>=CAST(:start AS date) AND h.orderdate<CAST(:end AS date)
    )
