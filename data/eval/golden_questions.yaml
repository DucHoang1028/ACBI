- id: GQ28
  question: Sản lượng Factory B tháng trước?
  user: manager
  expected_status: ok
  metric_ids:
  - production_output
  metric_versions:
    production_output: 1
  period: last_month
  parameters:
    factory_id: 2
  reference_sql: |-
    WITH terminal AS (
     SELECT DISTINCT ON (workorderid) workorderid, locationid
     FROM production.workorderrouting
     ORDER BY workorderid, operationsequence DESC, locationid
    ), fact AS (
     SELECT w.*, (w.orderqty-w.scrappedqty) AS stockedqty,
            t.locationid, lf.factory_id
     FROM production.workorder w
     LEFT JOIN terminal t ON t.workorderid=w.workorderid
     LEFT JOIN acbi_demo.location_factory lf ON lf.locationid=t.locationid
    )
    SELECT SUM(w.stockedqty) AS production_output,COUNT(*) AS sample_count FROM fact w WHERE w.enddate >= CAST(:start AS date) AND w.enddate < CAST(:end AS date) AND w.factory_id=:factory_id HAVING COUNT(*)>0 LIMIT 100
  paths:
  - structured_intent
  - rag_text_to_sql
  approval_requirement: Expected outcomes apply only after approval of the proposed definitions.
