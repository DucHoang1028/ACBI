- id: GQ24
  question: Doanh thu tháng trước tăng bao nhiêu so với tháng liền trước?
  user: manager
  expected_status: ok
  metric_ids:
  - sales_growth
  metric_versions:
    sales_growth: 1
  period: last_month
  parameters: {}
  reference_sql: |-
    WITH periods AS (
     SELECT SUM(subtotal) FILTER (WHERE orderdate>=CAST(:start AS date) AND orderdate<CAST(:end AS date)) AS current_revenue,
     SUM(subtotal) FILTER (WHERE orderdate>=CAST(:baseline_start AS date) AND orderdate<CAST(:baseline_end AS date)) AS previous_revenue,
     COUNT(*) FILTER (WHERE orderdate>=CAST(:start AS date) AND orderdate<CAST(:end AS date)) AS current_count,
     COUNT(*) FILTER (WHERE orderdate>=CAST(:baseline_start AS date) AND orderdate<CAST(:baseline_end AS date)) AS previous_count
     FROM sales.salesorderheader
    )
    SELECT current_revenue,previous_revenue,(current_revenue-previous_revenue)/NULLIF(previous_revenue,0) AS sales_growth
    FROM periods WHERE current_count>0 AND previous_count>0 LIMIT 100
  paths:
  - structured_intent
  - rag_text_to_sql
  approval_requirement: Expected outcomes apply only after approval of the proposed definitions.
  notes: Two full calendar months; zero baseline returns NULL, never infinity.
