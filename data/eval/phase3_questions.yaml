  - id: P3-05
    question: Sales growth by territory last month
    user: manager
    metric_id: sales_growth
    dimension: sales_territory
    period: last_month
    example: example:sales_growth:territory
    expected_status: ok
    chart_type: bar
    reference_sql: |
      WITH periods AS (
        SELECT territoryid,
          sum(subtotal) FILTER (WHERE orderdate>=:start AND orderdate<:end) AS current_revenue,
          sum(subtotal) FILTER (WHERE orderdate>=:baseline_start AND orderdate<:baseline_end) AS previous_revenue,
          count(*) FILTER (WHERE orderdate>=:start AND orderdate<:end) AS current_count,
          count(*) FILTER (WHERE orderdate>=:baseline_start AND orderdate<:baseline_end) AS previous_count
        FROM sales.salesorderheader GROUP BY territoryid
      )
      SELECT p.territoryid,t.name AS territory,p.current_revenue,p.previous_revenue,
        (p.current_revenue-p.previous_revenue)/nullif(p.previous_revenue,0) AS sales_growth
      FROM periods p JOIN sales.salesterritory t USING(territoryid)
      WHERE p.current_count>0 AND p.previous_count>0
      ORDER BY p.territoryid
  - id: P3-06
    question: Weekly revenue in 2099
    user: manager
    metric_id: revenue
    dimension: week
    period: explicit
    start_date: '2099-01-01'
    end_date: '2100-01-01'
    example: example:revenue:weekly
    expected_status: no_data
    reference_sql: |
      SELECT date_trunc('week',orderdate)::date AS week,
        sum(subtotal) AS revenue,count(*) AS sample_count
