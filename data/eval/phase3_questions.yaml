schema_version: 1
scope: Additional supported RAG patterns; FakeLLM supplies approved SQL examples.
questions:
  - id: P3-01
    question: Weekly revenue last month
    user: sales
    metric_id: revenue
    dimension: week
    period: last_month
    example: example:revenue:weekly
    expected_status: ok
    chart_type: line
    reference_sql: |
      SELECT date_trunc('week',orderdate)::date AS week,
        sum(subtotal) AS revenue,count(*) AS sample_count
      FROM sales.salesorderheader
      WHERE orderdate>=:start AND orderdate<:end
      GROUP BY week ORDER BY week
  - id: P3-02
    question: Daily production output last month for Factory A
    user: production_a
    metric_id: production_output
    dimension: day
    period: last_month
    factory_id: 1
    example: example:production_output:daily
    expected_status: ok
    chart_type: line
    reference_sql: |
      WITH terminal AS (
        SELECT DISTINCT ON (workorderid) workorderid,locationid
        FROM production.workorderrouting
        ORDER BY workorderid,operationsequence DESC,locationid
      )
      SELECT w.enddate::date AS day,sum(w.orderqty-w.scrappedqty) AS production_output,
        count(*) AS sample_count
      FROM production.workorder w
      JOIN terminal t USING(workorderid)
      JOIN acbi_demo.location_factory f USING(locationid)
      WHERE w.enddate>=:start AND w.enddate<:end AND f.factory_id=1
      GROUP BY day ORDER BY day LIMIT 100
  - id: P3-03
    question: Daily defect rate last year
    user: manager
    metric_id: defect_rate
    dimension: day
    period: last_year
    example: example:defect_rate:daily
    expected_status: ok
    chart_type: line
    reference_sql: |
      SELECT enddate::date AS day,
        sum(scrappedqty)::numeric/nullif(sum(orderqty),0) AS defect_rate,
        count(*) AS sample_count
      FROM production.workorder
      WHERE enddate>=:start AND enddate<:end
      GROUP BY day ORDER BY day LIMIT 100
