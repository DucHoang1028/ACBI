name: ACBI checks
on:
  push:
  pull_request:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests scripts
      - run: black --check backend/app backend/tests scripts
      - run: mypy backend/app
      - run: pytest backend/tests/unit -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --prefix frontend
      - run: npm run build --prefix frontend
